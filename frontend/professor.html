<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Área do Professor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="professor-page">

<header class="prof-header">
    <div>
        <h1>Área do Professor</h1>
        <p id="nomeProfessor"></p>
    </div>

    <button class="btn-sair" onclick="sair()">
        Sair
    </button>
</header>

<main class="prof-container">

    <section class="prof-card">
        <h2>📄 Criar Trabalho</h2>

        <label>Matéria *</label>
        <select id="materia"></select>

        <label>Título do Trabalho *</label>
        <input
            type="text"
            id="titulo"
            placeholder="Digite o título do trabalho"
        >

        <div class="prof-grid">
            <div>
                <label>Data de Início *</label>
                <input type="date" id="dataInicio">
            </div>

            <div>
                <label>Data Final *</label>
                <input type="date" id="dataFim">
            </div>
        </div>

        <label class="checkbox-line">
            <input type="checkbox" id="usarSenha">
            Definir senha para os grupos
        </label>

        <label>Senha dos grupos</label>
        <input
            type="text"
            id="senhaGrupo"
            placeholder="Digite a senha dos grupos"
        >

        <div class="grupo-topo">
            <h3>👥 Grupos</h3>
            <button type="button" onclick="adicionarGrupoVisual()">
                + Adicionar Grupo
            </button>
        </div>

        <div id="gruposProfessor" class="grupos-area">
            <p class="empty-box">
                Nenhum grupo adicionado. Clique em "Adicionar Grupo" para começar.
            </p>
        </div>

        <button class="btn-criar" onclick="criarTrabalho()">
            Criar Trabalho
        </button>

        <p id="mensagem"></p>
    </section>

    <section class="prof-card">
        <h2>📄 Trabalhos Criados</h2>

        <div id="listaTrabalhos">
            <div class="empty-box">
                Nenhum trabalho criado ainda.
            </div>
        </div>
    </section>

</main>

<script src="script.js"></script>
<script src="professor.js"></script>
</body>
</html>
