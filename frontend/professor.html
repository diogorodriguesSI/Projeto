<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Professor</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="professor-page">

<header class="prof-header">
    <div>
        <h1>Área do Professor</h1>
        <p id="nomeProfessor">Carregando professor...</p>
    </div>

    <button class="btn-sair" onclick="sair()">Sair</button>
</header>

<main class="prof-container">

    <section class="prof-card">
        <h2>📄 Criar Trabalho</h2>

        <label for="materia">Matéria *</label>
        <select id="materia"></select>

        <label for="titulo">Título do Trabalho *</label>
        <input
            type="text"
            id="titulo"
            placeholder="Ex: Trabalho de Banco de Dados"
        >

        <div class="prof-grid">
            <div>
                <label for="dataInicio">Data de Início *</label>
                <input type="date" id="dataInicio">
            </div>

            <div>
                <label for="dataFim">Data Final *</label>
                <input type="date" id="dataFim">
            </div>
        </div>

        <label class="checkbox-line">
            <input type="checkbox" id="usarSenha">
            Usar senha para entrar nos grupos
        </label>

        <label for="senhaGrupo">Senha dos grupos</label>
        <input
            type="text"
            id="senhaGrupo"
            placeholder="Opcional. Ex: grupo123"
        >

        <div class="grupo-topo">
            <div>
                <h3>👥 Grupos do trabalho</h3>
                <p>Crie cada grupo em uma caixa separada, com tema, limite e funções.</p>
            </div>

            <button
                type="button"
                class="btn-secundario"
                onclick="adicionarGrupoVisual()"
            >
                + Adicionar Grupo
            </button>
        </div>

        <div id="gruposProfessor" class="grupos-area">
            <div class="empty-box">
                Nenhum grupo adicionado. Clique em “Adicionar Grupo” para começar.
            </div>
        </div>

        <button class="btn-criar" onclick="criarTrabalho()">
            Criar Trabalho
        </button>

        <p id="mensagem"></p>
    </section>

    <section class="prof-card">
        <h2>📚 Trabalhos Criados</h2>

        <div id="listaTrabalhos">
            <div class="empty-box">
                Nenhum trabalho criado ainda.
            </div>
        </div>
    </section>

</main>

<script src="script.js"></script>
<script src="professor.js"></script>

</body>
</html>
